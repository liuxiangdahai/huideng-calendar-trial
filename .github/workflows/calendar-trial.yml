name: Calendar checks and trial release
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: '正常验收发布，或仅恢复11月8日中断的试用后台'
        type: choice
        default: release
        options: [release, recover-trial-20261108]
permissions:
  contents: read
concurrency:
  group: calendar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: inputs.operation != 'recover-trial-20261108'
    runs-on: ubuntu-latest
    # The browsers and their system libraries come baked into Playwright's own
    # image, so checks never wait on Ubuntu's package mirrors. On 2026-11-11
    # the runners could not resolve azure.archive.ubuntu.com and
    # `playwright install --with-deps` hung for over an hour, holding the
    # release. Keep the tag equal to @playwright/test in package-lock.json;
    # the first step below fails fast if they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Compared with a copy taken before the checks rather than with git, so
      # the step does not depend on git being present in the image.
      - name: Keep the committed generated date data
        run: |
          mkdir -p /tmp/committed
          cp -r static/calendar-reminders/calendar-data.json static/calendar-reminders/feeds /tmp/committed/
      - run: npm run check:calendar
      - name: Require committed generated date data
        run: |
          diff -r /tmp/committed/feeds static/calendar-reminders/feeds
          cmp /tmp/committed/calendar-data.json static/calendar-reminders/calendar-data.json
      - name: Playwright image matches the locked test runner
        run: |
          locked=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$locked" = "1.64.1" || { echo "::error::@playwright/test is $locked; update the container tag to v$locked-noble"; exit 1; }
      - run: npm run test:browser:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
  release:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CALENDAR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: calendar-trial
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CALENDAR_BUILD_VERSION: ${{ github.sha }}
      CALENDAR_EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:calendar
      - name: Verify release date data matches the checked commit
        run: git diff --exit-code HEAD -- static/calendar-reminders/calendar-data.json static/calendar-reminders/feeds
      - name: Write environment binding configuration
        env:
          DEPLOY_CONFIG: ${{ secrets.CALENDAR_DEPLOY_CONFIG }}
        run: node -e "require('fs').writeFileSync('deployment.local.json',process.env.DEPLOY_CONFIG)"
      - name: Verify Cloudflare credential permissions without mutations
        run: node tools/calendar/cloudflare-metrics.mjs --preflight --output artifacts/cloudflare-preflight.json
      - run: node tools/calendar/build-environment.mjs acceptance
      - run: npx wrangler d1 migrations apply DB --remote --config dist/acceptance/worker/wrangler.json
      - run: npx wrangler deploy --config dist/acceptance/worker/wrangler.json
      - run: node tools/calendar/ci-remote.mjs acceptance worker-health
      - name: Deploy isolated Pages and its service binding
        run: npx wrangler pages deploy --cwd dist/acceptance/pages --project-name huideng-calendar-acceptance --branch main
      - run: node tools/calendar/ci-remote.mjs acceptance verify
      - name: Verify reminder controls through the isolated Pages subscription
        run: node tools/calendar/smoke-reminder-probe.mjs
      - name: Choose full or light acceptance test
        id: scope
        run: node tools/calendar/smoke-scope.mjs https://huideng-calendar-trial.pages.dev "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Test only the isolated Pages public service
        env:
          CALENDAR_SMOKE_SCOPE: ${{ steps.scope.outputs.scope }}
        run: node tools/calendar/ci-remote.mjs acceptance smoke
      - name: Collect isolated service CPU evidence
        if: ${{ (success() || failure()) && hashFiles('artifacts/remote-smoke.json') != '' }}
        run: node tools/calendar/cloudflare-metrics.mjs --smoke-report artifacts/remote-smoke.json
      - run: node tools/calendar/build-environment.mjs trial
      - run: npx wrangler d1 migrations apply DB --remote --config dist/trial/worker/wrangler.json
      - run: npx wrangler deploy --config dist/trial/worker/wrangler.json
      - run: node tools/calendar/ci-remote.mjs trial worker-health
      - run: npx wrangler pages deploy --cwd dist/trial/pages --project-name huideng-calendar-trial --branch main
      - run: node tools/calendar/ci-remote.mjs trial verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            artifacts/remote-smoke.json
            artifacts/cloudflare-metrics.json
            artifacts/cloudflare-preflight.json
            artifacts/reminder-probe-remote.json
          retention-days: 30
  remote-acceptance:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.CALENDAR_REMOTE_CHECK_ENABLED == 'true' && vars.CALENDAR_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the explicitly deployed acceptance version
        env:
          API_URL: ${{ vars.CALENDAR_ACCEPTANCE_URL }}
          EXPECTED: ${{ vars.CALENDAR_ACCEPTANCE_VERSION }}
        run: node tools/calendar/verify-release.mjs "$API_URL" "" "$EXPECTED"
      - name: Subscription lifecycle from GitHub hosted network
        env:
          API_URL: ${{ vars.CALENDAR_ACCEPTANCE_URL }}
          SITE_ORIGIN: https://huideng-calendar-acceptance.pages.dev
          CALENDAR_EXPECTED_VERSION: ${{ vars.CALENDAR_ACCEPTANCE_VERSION }}
        run: node tools/calendar/smoke-remote.mjs "$API_URL" "$SITE_ORIGIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-remote-check
          path: artifacts/remote-smoke.json
          retention-days: 7
  recover-trial:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'recover-trial-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: calendar-trial
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore only the verified Worker matching the existing Pages release
        run: node tools/calendar/recover-trial-20261108.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-recovery-evidence
          path: artifacts/trial-recovery.json
          retention-days: 30
